name: Build CreatorKit release

on:
  push:
    branches: [main]
    tags:
      - "v*"
    paths:
      - "src/**"
      - "electron/**"
      - "package.json"
      - "vite.config.ts"
      - "capacitor.config.ts"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web:
    name: Build web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: tar -czf CreatorKit-Web.tar.gz -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: CreatorKit-Web
          path: CreatorKit-Web.tar.gz
          if-no-files-found: error

  desktop:
    name: Build desktop (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: Windows
            command: npm run desktop:win
            path: "dist-desktop/*.exe"
          - os: macos-latest
            target: macOS
            command: npm run desktop:mac
            path: |
              dist-desktop/*.dmg
              dist-desktop/*-mac.zip
          - os: ubuntu-latest
            target: Linux
            command: npm run desktop:linux
            path: |
              dist-desktop/*.AppImage
              dist-desktop/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: CreatorKit-${{ matrix.target }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - run: npm install
      - run: npm run build
      - run: npx cap add android
      - run: npx cap sync android
      - name: Configure Android compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/variables.gradle")
          if p.exists():
              s = p.read_text()
              import re
              s = re.sub(r"minSdkVersion\\s*=\\s*\\d+", "minSdkVersion = 23", s)
              s = re.sub(r"compileSdkVersion\\s*=\\s*\\d+", "compileSdkVersion = 35", s)
              s = re.sub(r"targetSdkVersion\\s*=\\s*\\d+", "targetSdkVersion = 35", s)
              p.write_text(s)
          else:
              raise SystemExit("Expected Capacitor Android SDK configuration was not generated")
          PY
          cat android/variables.gradle
      - name: Build and verify Android APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon clean assembleDebug
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee ../apk-badging.txt
          grep -Fq "package: name='net.creatorkit.app'" ../apk-badging.txt
          grep -Fq "sdkVersion:'23'" ../apk-badging.txt
          grep -Fq "targetSdkVersion:'35'" ../apk-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | tee ../apk-permissions.txt
          unzip -l "$APK" | grep -E 'lib/(arm64-v8a|armeabi-v7a|x86|x86_64)/' || true
          cp "$APK" ../CreatorKit-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CreatorKit-Android
          path: CreatorKit-Android.apk
          if-no-files-found: error

  ios-simulator:
    name: Build iOS simulator app (unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npx cap add ios
      - run: npx cap sync ios
      - name: Compile iOS simulator app
        run: xcodebuild -workspace ios/App/App.xcworkspace -scheme App -sdk iphonesimulator -configuration Release -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO
      - name: Package simulator app
        run: |
          APP_PATH="$(find build/ios/Build/Products/Release-iphonesimulator -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" CreatorKit-iOS-Simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CreatorKit-iOS-Simulator-unsigned
          path: CreatorKit-iOS-Simulator.zip
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    needs: [web, desktop, android, ios-simulator]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: false
      - name: Create release notes
        run: |
          cat > release-notes.md <<'EOF'
          ## CreatorKit build release

          Download the asset matching your platform.

          - **Windows:** installer / portable build.
          - **macOS:** DMG / ZIP. This build is not notarized unless signing is configured.
          - **Linux:** AppImage / DEB.
          - **Android:** debug APK for testing; not a Play Store-signed release.
          - **Web:** static web build archive.
          - **iOS:** simulator-only unsigned app for development/testing. This is **not** an installable iPhone IPA.

          This release pipeline packages the current repository implementation. Features requiring YouTube API access, cloud sync, accounts, or payments are not configured in this source baseline. Test before relying on it.
          EOF
      - uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('nightly-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('CreatorKit {0}', github.ref_name) || format('CreatorKit Nightly {0}', github.run_number) }}
          body_path: release-notes.md
          files: release-assets/**/*
          draft: false
          prerelease: true
