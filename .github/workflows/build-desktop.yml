name: Build desktop apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'electron/**'
      - 'package.json'
      - 'vite.config.ts'
      - '.github/workflows/build-desktop.yml'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            command: npm run desktop:win
          - os: macos-latest
            target: mac
            command: npm run desktop:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: CreatorKit-${{ matrix.target }}
          path: dist-desktop/*
          if-no-files-found: error
